name: icloud_sync
status: proposed
requirements: [REQ-SYNC-001]
source: spec/adr/013-ios-companion-app.md
engine: CKSyncEngine, private database, zone "MacParakeet"

input:
  enabled: bool                # AppPreferences key "iCloudSyncEnabled", default false, per device

output:
  record_types:
    CustomWord:
      id: custom_words.id
      fields: [word, replacement, source, isEnabled, createdAt, updatedAt, deletedAt]
      natural_key: lowercased(word)
    TextSnippet:
      id: text_snippets.id
      fields: [trigger, expansion, isEnabled, action, createdAt, updatedAt, deletedAt]
      encrypted: [expansion]
      natural_key: lowercased(trigger)
    Dictation:
      id: dictations.id
      fields: [createdAt, durationMs, rawTranscript, cleanTranscript, processingMode, status, wordCount, updatedAt, deletedAt]
      encrypted: [rawTranscript, cleanTranscript]
    Preferences:
      id: fixed "preferences"
      fields: [processingMode, voiceReturnEnabled, voiceReturnTrigger, updatedAt]

errors:
  - icloud_account_unavailable
  - quota_exceeded
  - zone_reset                 # server zone deleted; re-upload all local records
  - network_unavailable        # retried by CKSyncEngine; not surfaced unless persistent

invariants:
  - With enabled == false, no CKSyncEngine instance exists and no CloudKit API is called
  - Never uploaded - audio files, audioPath, pastedToApp, hidden dictations, transcriptions, chat_conversations, LLM config, API keys, telemetry consent, hotkey, device-specific settings
  - Setting hidden = true on an already-synced dictation enqueues a delete for its record
  - Conflicts resolve last-writer-wins on updatedAt per record; ties keep the server record
  - Inbound CustomWord/TextSnippet whose natural_key matches a different local id merges into the record with the earlier createdAt; the other id is tombstoned on both sides
  - Deletes are soft (deletedAt set); tombstones older than 30 days are purged locally after successful sync
  - Disabling sync stops the engine and keeps all local rows; deleting cloud data is a separate explicit action
