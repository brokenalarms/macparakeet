name: MacParakeetiOS

options:
  bundleIdPrefix: com.macparakeet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.10.0
  # Newer than the Mac pin: tdtCtc110m (bundled English model) needs it. The Mac
  # STTClient doesn't compile against it, so iOS uses CoreReplacements/MobileSTTClient.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.17.7

targets:
  MacParakeetCoreiOS:
    type: framework
    platform: iOS
    sources:
      - path: ../Sources/MacParakeetCore
        excludes:
          - Audio/AudioRecorder.swift
          - Audio/AudioDeviceManager.swift
          - Audio/AudioProcessor.swift
          - Audio/AudioFileConverter.swift
          - Services/AccessibilityService.swift
          - Services/ClipboardService.swift
          - Services/PermissionService.swift
          - Services/LaunchAtLoginService.swift
          - Services/LocalCLIExecutor.swift
          - Services/LocalCLILLMClient.swift
          - Services/RoutingLLMClient.swift
          - Services/LLMExecutionContext.swift
          - Services/LLMService.swift
          - Services/LLMClient.swift
          - Services/YouTubeDownloader.swift
          - Services/VideoStreamService.swift
          - Services/ThumbnailCacheService.swift
          - Services/BinaryBootstrap.swift
          - Services/ExportService.swift
          - Services/AutoSaveService.swift
          - Services/TranscriptionService.swift
          - Services/DiarizationService.swift
          - Services/SpeakerMerger.swift
          - STT/STTClient.swift
          - STT/FnKeyStateMachine.swift
          - STT/HotkeyTrigger.swift
          - STT/KeyCodeNames.swift
          - DictationFlow/DictationFlowStateMachine.swift
          # No network code on iOS beyond the model download (local-first)
          - Services/TelemetryService.swift
          - Services/CrashReporter.swift
          - Services/FeedbackService.swift
          - Services/DiscoverService.swift
          - Services/DiscoverThoughtsService.swift
          - Licensing/LemonSqueezyLicenseAPI.swift
          - Licensing/EntitlementsService.swift
      - path: CoreReplacements
    dependencies:
      - package: GRDB
      - package: FluidAudio
    settings:
      base:
        PRODUCT_NAME: MacParakeetCore
        PRODUCT_MODULE_NAME: MacParakeetCore
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).core
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES

  MacParakeetiOS:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: ../Sources/MacParakeetViewModels/CustomWordsViewModel.swift
      - path: ../Sources/MacParakeetViewModels/TextSnippetsViewModel.swift
      # English speech model, fetched by `make models` (gitignored)
      - path: Models/parakeet-tdt-ctc-110m-coreml
        type: folder
        buildPhase: resources
    dependencies:
      - target: MacParakeetCoreiOS
      - target: MacParakeetKeyboard
      - target: MacParakeetWidgets
      - package: GRDB
      - package: FluidAudio
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MacParakeet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MacParakeetAppGroup: $(APP_GROUP_ID)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: MacParakeet records your voice to transcribe it on this iPhone. Audio never leaves the device.
        CFBundleURLTypes:
          - CFBundleURLName: com.macparakeet.session
            CFBundleURLSchemes: [macparakeet]
    entitlements:
      path: App/MacParakeetiOS.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_STRICT_CONCURRENCY: complete

  MacParakeetKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: MacParakeet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        MacParakeetAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/MacParakeetKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_STRICT_CONCURRENCY: complete

  MacParakeetWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared/SessionActivityAttributes.swift
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: MacParakeet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_STRICT_CONCURRENCY: complete

  MacParakeetiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Shared
      - path: App/AppSettings.swift
      - path: App/DictationSessionStateMachine.swift
      - path: App/DictationSessionController.swift
      - path: App/OnboardingViewModel.swift
      - path: App/SpeechModelSettingsViewModel.swift
      - path: App/HistoryViewModel.swift
    dependencies:
      - target: MacParakeetCoreiOS
      - package: GRDB
      - package: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MacParakeetiOS:
    build:
      targets:
        MacParakeetiOS: all
        MacParakeetiOSTests: [test]
    test:
      targets:
        - MacParakeetiOSTests
