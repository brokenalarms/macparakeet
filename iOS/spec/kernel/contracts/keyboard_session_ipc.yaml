name: keyboard_session_ipc
status: proposed
requirements: [REQ-IOS-002, REQ-IOS-003]
source: iOS/spec/adr/001-ios-companion-app.md

transport:
  app_group: group.com.macparakeet
  signals: CFNotificationCenterGetDarwinNotifyCenter (no payload)
  files:
    command: <app_group>/ipc/command.json   # written only by the keyboard
    session: <app_group>/ipc/session.json   # written only by the host app
  write_semantics: atomic replace (write temp file, rename)
  notifications:
    command_posted: com.macparakeet.ios.command        # keyboard -> app
    session_changed: com.macparakeet.ios.session        # app -> keyboard
  launch_url: macparakeet://session/start

input:
  command:
    schemaVersion: int (1)
    requestID: uuid            # generated by the keyboard per dictation
    action: start | stop | cancel
    issuedAt: iso8601

output:
  session:
    schemaVersion: int (1)
    sessionID: uuid            # new per audio-session activation
    state: ready | recording | processing | ended
    heartbeatAt: iso8601
    activeRequestID: optional uuid
    result:                    # optional
      requestID: uuid
      text: string             # post-pipeline text; empty string for empty transcript
      postAction: optional KeyAction rawValue   # "return" from a Voice Return snippet
      completedAt: iso8601
    error:                     # optional
      requestID: optional uuid
      code: error_code

  keyboard_view_state:         # derived by the keyboard on appear and on every session_changed
    - full_access_required: Full Access not granted
    - no_session: session file missing, state == ended, or now - heartbeatAt > 5 s
    - idle: state == ready
    - recording: state == recording and activeRequestID was issued by this keyboard
    - processing: state == processing and activeRequestID was issued by this keyboard
    - busy_elsewhere: state in [recording, processing] and activeRequestID was not issued by this keyboard

errors:
  - full_access_required
  - app_launch_failed
  - microphone_denied
  - model_not_ready
  - audio_session_failed
  - stt_failed
  - stale_command

invariants:
  - Each file has exactly one writer process; the keyboard never writes session.json and the app never writes command.json
  - Commands are ignored with error stale_command when issuedAt is older than 10 s at read time
  - A start command is ignored unless state == ready; stop/cancel are ignored unless requestID == activeRequestID
  - The keyboard inserts result.text only if result.requestID is in its own issued set and has not been inserted before
  - Empty result.text is never inserted and never surfaced as an error
  - postAction "return" is performed after result.text by textDocumentProxy.insertText("\n"); it is performed even when text is empty
  - No audio, audio paths, or model files are written to the App Group ipc directory
  - The keyboard extension reads and writes only the ipc directory; it never opens macparakeet.db
