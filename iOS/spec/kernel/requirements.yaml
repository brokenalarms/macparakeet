# MacParakeet iOS Requirements
# Same kernel method as the Mac app (spec/10-ai-coding-method.md); entries carry
# source + acceptance. The Mac spec does not reference anything in iOS/.
#
# Areas:
#   IOS - iOS app (keyboard-launched dictation)

REQ-IOS-001:
  description: iOS host app builds from shared MacParakeetCore and dictates in-app with the clean pipeline
  version: ios-v1
  status: active
  priority: p0
  source: iOS/spec/adr/001-ios-companion-app.md
  acceptance:
    - iOS/ builds MacParakeetCore from ../Sources/MacParakeetCore for the iOS 17 simulator and device
    - No file outside iOS/ is modified; swift test stays green
    - Given the bundled model and mic permission, tapping record in the host app then stop yields text processed by TextRefinementService in the configured processing mode
    - Clean mode (filler removal, custom words, snippets) produces the same output as macOS for the same raw transcript, custom words, and snippets, because both compile the same TextProcessingPipeline source
    - Processing mode defaults to raw (as on macOS) and is selectable as raw or clean in Vocabulary
    - Audio is captured and transcribed on device; no network request is made during dictation
    - The iOS build contains no telemetry, crash-report, feedback, or licensing network code; the only network access is the optional multilingual model download

REQ-IOS-002:
  description: Host app holds a background dictation session with heartbeat and idle timeout
  version: ios-v1
  status: active
  priority: p0
  source: iOS/spec/adr/001-ios-companion-app.md
  contract: iOS/spec/kernel/contracts/keyboard_session_ipc.yaml
  state_machine: iOS/spec/kernel/state_machines/dictation_session.yaml
  acceptance:
    - Opening the app via macparakeet://session/start activates the audio session and enters ready
    - While ready, recording, or processing, the session file heartbeat is refreshed at most every 2 s
    - After the idle timeout (default 5 min, configurable) in ready, the audio session is deactivated, the session file state becomes ended, and the Live Activity ends
    - A Live Activity is visible for the whole time the audio session is held
    - An audio interruption during recording transcribes the audio captured so far; the session returns to ready when the interruption ends, or ended if the audio session cannot be reactivated

REQ-IOS-003:
  description: Keyboard extension starts/stops dictation and inserts the result via textDocumentProxy
  version: ios-v1
  status: active
  priority: p0
  source: iOS/spec/adr/001-ios-companion-app.md
  contract: iOS/spec/kernel/contracts/keyboard_session_ipc.yaml
  acceptance:
    - With no live session, tapping mic opens the host app; after the user returns, the next mic tap starts recording without another app switch
    - With a live session, mic tap starts recording and the second tap stops it
    - The keyboard inserts a result only if its requestID matches a request this keyboard instance issued, and inserts each requestID at most once
    - An empty transcript inserts nothing and shows no error
    - A Voice Return snippet match (postAction return) inserts the cleaned text followed by a newline
    - Without Full Access the keyboard shows only an enable-Full-Access prompt plus globe key
    - The keyboard target does not link MacParakeetCore

REQ-IOS-004:
  description: First-run onboarding covers the bundled model check, microphone, keyboard install, and Full Access
  version: ios-v1
  status: active
  priority: p1
  source: iOS/spec/adr/001-ios-companion-app.md
  acceptance:
    - The English model ships in the app bundle; onboarding needs no download and marks the model step done when the bundled model is present
    - Full Access is explained before the user reaches the system warning
    - Onboarding completion is not required to reopen the app; incomplete steps are resumable

REQ-IOS-005:
  description: iOS history, vocabulary (processing mode, custom words, snippets), and settings screens
  version: ios-v1
  status: active
  priority: p1
  source: iOS/spec/adr/001-ios-companion-app.md
  acceptance:
    - History lists non-hidden dictations newest first with substring search, copy, and delete
    - Custom words and snippets support add, edit, enable/disable, delete with the same validation as macOS
    - Private dictation mode behaves as the Mac's REQ-DICT-005

REQ-IOS-006:
  description: Speech model choice — bundled English model, optional multilingual download
  version: ios-v1
  status: active
  priority: p1
  source: iOS/spec/adr/001-ios-companion-app.md
  acceptance:
    - English (Parakeet TDT-CTC 110M) is bundled and selected by default; dictation works offline on first launch
    - Settings offers a download of the multilingual model (Parakeet TDT 0.6B v3) with progress, retry after failure, and refusal when free space is below model size plus margin
    - The multilingual model directory is excluded from iCloud backup
    - A finished download selects the multilingual model; only downloaded models can be selected
    - Deleting the multilingual model frees its storage and returns to English
    - If the stored choice is multilingual but its files are missing, dictation uses English
